# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name dev.gobeauty.site;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name dev.gobeauty.site;

    # SSL certificates (adjust paths if needed)
    ssl_certificate /etc/letsencrypt/live/dev.gobeauty.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.gobeauty.site/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size (avatars)
    client_max_body_size 10M;

    # Static files - served directly by nginx
    location /static/ {
        alias /home/taximeter/beautygo/dev/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files - served directly by nginx
    location /media/ {
        alias /home/taximeter/beautygo/dev/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API and admin - reverse proxy to gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
