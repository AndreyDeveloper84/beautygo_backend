# Pre-commit hooks for djangoproject (W0-X1 secret containment).
#
# Setup once after clone:
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# Two complementary layers:
#   1. detect-secrets — entropy/pattern scan against the checked-in
#      baseline; fails on any NEW secret not present in the baseline.
#   2. sensitive-file-guard — filename denylist that refuses
#      credential-bearing names even when entropy scanning would not
#      flag them (see scripts/sensitive_file_guard.py).

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            .*\.lock
          )$

  - repo: local
    hooks:
      - id: sensitive-file-guard
        name: Refuse credential-bearing filenames (.env, *.pem, service-account JSON, ...)
        entry: python scripts/sensitive_file_guard.py
        language: system
        # The script inspects the staged diff itself (paths only, never
        # contents), so pre-commit must not pass filenames and the hook
        # must run on every commit.
        pass_filenames: false
        always_run: true

      # PII guard (DRF-1269). detect-secrets looks for secrets; a person's
      # phone number and e-mail addresses sat on the head of `dev` and
      # passed it, because none of them is high-entropy. Refuses phones
      # outside the test ranges, e-mails outside reserved/own domains, six
      # known channel ids (held as SHA-256, never as values), unmasked
      # `max:<digits>` in docs/, and dump/log extensions outright. Runs on
      # the staged files it is given; CI runs the same script over every
      # tracked file. Allowlist with reasons: scripts/pii_guard_allow.txt.
      - id: pii-guard
        name: PII guard (phones, e-mails, channel ids, dumps)
        entry: python scripts/pii_guard.py
        language: system
        pass_filenames: true
