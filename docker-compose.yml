# DRF-2272 — логи прикладных сервисов. Драйвер по умолчанию (json-file) держит
# лог в каталоге контейнера, и `up -d --force-recreate` выкладки удалял его
# вместе с контейнером. На стенде выкладка ставит CATALOG_LOG_DRIVER=journald —
# журнал хоста переживает пересоздание; локально (Docker Desktop, где journald
# нет) остаётся json-file. Срок хранения — journald.conf хоста, не compose.
# ПДн: в журнал идёт то, что прошло core.pii_log_filter (DRF-2272 C).
x-app-logging: &app_logging
  driver: ${CATALOG_LOG_DRIVER:-json-file}
  options:
    tag: "{{.Name}}"

services:
  web:
    logging: *app_logging
    build:
      context: .
      args:
        # DRF-1431. Which registry the base layer comes from. Default is
        # the upstream Docker Hub ref, so a fresh clone / laptop / CI is
        # unchanged. The dev deploy exports PYTHON_BASE_IMAGE=<GHCR ref>
        # before `docker compose build` (ci.yml step 2/4) because the
        # pilot VPS reaches Hub badly — see the comment block at the top
        # of the Dockerfile for the measurements.
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        # DRF-2409 — владелец каталога отчётов внутри образа. Те же значения,
        # что у `user:` ниже: каталог, созданный не тому uid, существует и
        # не пишется — ровно состояние, сломавшее стенд.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
      # DRF-2996. Токен для клона приватного ayla-ai-core — секрет BuildKit,
      # не build-arg: значение build-arg печатает `docker history` и хранит
      # история BuildKit. Источник — переменная GH_DEPLOY_TOKEN окружения
      # compose (см. `secrets:` внизу файла); пустая даёт анонимный клон.
      secrets:
        - gh_deploy_token
    restart: unless-stopped
    # DRF-1677 (класс DRF-1646). Без `user:` контейнер идёт от root образа —
    # в Dockerfile нет USER, — и всё, что entrypoint пишет в смонтированные
    # каталоги (`collectstatic` → staticfiles/, загрузки → media/), ложится
    # на хост от root. Замер 11.09.2026 на пилоте: 197 root-объектов, все в
    # staticfiles/. Владелец дерева их не перезапишет.
    #
    # Умолчание 1000 здесь допустимо — в отличие от `--user "$(id -u)"` у
    # бота (DRF-1646), который под root честно давал 0:0. Неверный uid тут
    # падает ВИДИМО: EACCES на записи в staticfiles/, а не молчаливый root.
    # 1000 — uid владельца дерева на пилоте (taximeter); другая машина задаёт
    # APP_UID/APP_GID в .env рядом с compose.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=djangoProject.settings.prod
      - REDIS_URL=redis://redis:6379
      # DRF-2996. `.env` подключён как env_file; пока в нём лежит строка
      # GH_DEPLOY_TOKEN, процесс контейнера видел бы токен сборки.
      # `environment` перекрывает `env_file`: в контейнере переменная пустая.
      - GH_DEPLOY_TOKEN=
    volumes:
      - /home/taximeter/beautygo/dev/staticfiles:/app/staticfiles
      - /home/taximeter/beautygo/dev/media:/app/media
      # Firebase Service Account JSON. CI deploy writes the file (empty
      # iff secret unset → PushService stays in stub mode), so the bind
      # mount always resolves. Read-only inside the container — the
      # process never writes back.
      - ./firebase-admin.json:/app/firebase-admin.json:ro
      # DRF-2409: отчёт разбора услуг переживает пересоздание контейнера —
      # решение владельца 28.09, п.5 («храним 90 дней с последнего прогона
      # по салону»). Пишет его админка (этот сервис), чистит по сроку задача
      # в celery_worker — поэтому том смонтирован в оба. Пустой именованный
      # том при первом монтировании наполняется из образа вместе с владельцем
      # каталога (Dockerfile: chown ${APP_UID} на /app/var/mapping_reports).
      - mapping_reports:/app/var/mapping_reports
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    logging: *app_logging
    build:
      context: .
      # DRF-1431: same base-image indirection as `web`. Without it two of
      # the three services named in ci.yml's `docker compose build` would
      # still resolve python:3.12-slim from Docker Hub, and the deploy
      # would keep failing exactly where it failed on 2026-08-31.
      #
      # The ayla-ai-core token: same BuildKit secret as `web` (DRF-2996).
      # It used to be absent here (2026-08-31, the repo was public), and
      # after 2026-10-20 this service failed at the clone with «could not
      # read Username» while `web` built fine — the three services share
      # one requirements.txt and must share the secret.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        # DRF-2409 — владелец каталога отчётов внутри образа. Те же значения,
        # что у `user:` ниже: каталог, созданный не тому uid, существует и
        # не пишется — ровно состояние, сломавшее стенд.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
      secrets:
        - gh_deploy_token
    restart: unless-stopped
    # DRF-1677 (класс DRF-1646). Без `user:` контейнер идёт от root образа —
    # в Dockerfile нет USER, — и всё, что entrypoint пишет в смонтированные
    # каталоги (`collectstatic` → staticfiles/, загрузки → media/), ложится
    # на хост от root. Замер 11.09.2026 на пилоте: 197 root-объектов, все в
    # staticfiles/. Владелец дерева их не перезапишет.
    #
    # Умолчание 1000 здесь допустимо — в отличие от `--user "$(id -u)"` у
    # бота (DRF-1646), который под root честно давал 0:0. Неверный uid тут
    # падает ВИДИМО: EACCES на записи в staticfiles/, а не молчаливый root.
    # 1000 — uid владельца дерева на пилоте (taximeter); другая машина задаёт
    # APP_UID/APP_GID в .env рядом с compose.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=djangoProject.settings.prod
      - REDIS_URL=redis://redis:6379
      # DRF-2996. `.env` подключён как env_file; пока в нём лежит строка
      # GH_DEPLOY_TOKEN, процесс контейнера видел бы токен сборки.
      # `environment` перекрывает `env_file`: в контейнере переменная пустая.
      - GH_DEPLOY_TOKEN=
    command: celery -A djangoProject worker --loglevel=info --concurrency=2
    volumes:
      - ./firebase-admin.json:/app/firebase-admin.json:ro
      # DRF-2409: тот же том, что у web — задача очистки отчётов по сроку
      # идёт здесь и обязана видеть те же файлы.
      - mapping_reports:/app/var/mapping_reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    logging: *app_logging
    build:
      context: .
      # DRF-1431 — see celery_worker above. The ayla-ai-core token: same
      # BuildKit secret as `web` and `celery_worker` (DRF-2996).
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        # DRF-2409 — владелец каталога отчётов внутри образа. Те же значения,
        # что у `user:` ниже: каталог, созданный не тому uid, существует и
        # не пишется — ровно состояние, сломавшее стенд.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
      secrets:
        - gh_deploy_token
    restart: unless-stopped
    # DRF-1677 (класс DRF-1646). Без `user:` контейнер идёт от root образа —
    # в Dockerfile нет USER, — и всё, что entrypoint пишет в смонтированные
    # каталоги (`collectstatic` → staticfiles/, загрузки → media/), ложится
    # на хост от root. Замер 11.09.2026 на пилоте: 197 root-объектов, все в
    # staticfiles/. Владелец дерева их не перезапишет.
    #
    # Умолчание 1000 здесь допустимо — в отличие от `--user "$(id -u)"` у
    # бота (DRF-1646), который под root честно давал 0:0. Неверный uid тут
    # падает ВИДИМО: EACCES на записи в staticfiles/, а не молчаливый root.
    # 1000 — uid владельца дерева на пилоте (taximeter); другая машина задаёт
    # APP_UID/APP_GID в .env рядом с compose.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=djangoProject.settings.prod
      - REDIS_URL=redis://redis:6379
      # DRF-2996. `.env` подключён как env_file; пока в нём лежит строка
      # GH_DEPLOY_TOKEN, процесс контейнера видел бы токен сборки.
      # `environment` перекрывает `env_file`: в контейнере переменная пустая.
      - GH_DEPLOY_TOKEN=
    # Default PersistentScheduler reads CELERY_BEAT_SCHEDULE from settings
    # and keeps last-run state in a shelve file. Its DEFAULT path is
    # ./celerybeat-schedule — то есть /app, каталог образа, владелец root.
    # Комментарий здесь до 12.09.2026 утверждал «/tmp/celerybeat-schedule»,
    # а команда флага --schedule не несла: под root это было незаметно,
    # под `user:` (#354, DRF-1677) beat падал сразу после «db →
    # celerybeat-schedule» — 67 рестартов за ночь, ни одной периодической
    # задачи каталога (dispatch-outbox 10 с, publish-to-bot 30 с, purge).
    #
    # Файл состояния — на tmpfs, объявленном ЗДЕСЬ, с режимом 1777. Режим
    # обязателен и замерен (12.09, python:3.12-slim под 1000:1000): tmpfs
    # без mode docker поднял как 755 root — «Permission denied», тот же
    # класс; `mode: 1777` compose читает как ДЕСЯТИЧНОЕ 1777 (= 0o3361) —
    # тоже denied; работает восьмеричная запись 01777 (= 1023), и её
    # одинаково читают compose (yaml 1.2) и PyYAML сторожа (yaml 1.1).
    # Потеря состояния на пересоздании безвредна — интервальные задачи
    # стартуют сразу, crontab считаются от «сейчас».
    # Не /app/media: nginx отдаёт /media/ наружу. Не именованный volume:
    # его корень docker создаёт от root, и класс повторился бы.
    # Сторож: tests/test_compose_startup_writes_land_on_mounts.py.
    command: celery -A djangoProject beat --loglevel=info --schedule /app/celerybeat-state/celerybeat-schedule
    volumes:
      - ./firebase-admin.json:/app/firebase-admin.json:ro
      - type: tmpfs
        target: /app/celerybeat-state
        tmpfs:
          mode: 01777
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DRF-2996. Тот же `.env` целиком уходит и в Postgres; пока в нём
      # строка GH_DEPLOY_TOKEN, перекрыть её пустым значением, как у app-сервисов.
      GH_DEPLOY_TOKEN: ""
      POSTGRES_USER: ${POSTGRES_USER:-beautygo}
      # No default: a missing value used to fall back to a well-known
      # password on whatever host ran this file. `:?` makes compose refuse
      # to start with the variable named instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-beautygo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beautygo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Образ. `minio/minio:latest` и `minio/mc:latest` сняты с Docker Hub и
  # quay.io (01.11.2026: `pull access denied` / 401 с обоих реестров), шаг
  # 3/4 выкладки падает на pull. Берём Bitnami-сборку того же MinIO: тот же
  # S3 API, те же MINIO_ROOT_USER/MINIO_ROOT_PASSWORD, `mc` внутри образа.
  # Тег пинован: репозиторий bitnamilegacy заморожен (август 2025), `latest`
  # там не двигается, но и обновлений безопасности не будет — это мост до
  # замены хранилища (RustFS / SeaweedFS) отдельной задачей.
  #
  # Отличия от прежнего образа, учтённые ниже: данные в /bitnami/minio/data
  # (не /data); порты/консоль поднимает entrypoint образа сам (--address
  # :9000 --console-address :9001), поэтому `command:` снят; процесс идёт от
  # uid 1001, каталог данных в образе 775 root:root — именованный том
  # наследует права при первом создании и пишется.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # No defaults (same reason as POSTGRES_PASSWORD above): the vendor's
      # documented default credentials must never be what a host silently
      # runs with. settings/prod.py requires the same two variables.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set it in .env}
      # Bitnami по умолчанию выключает веб-консоль; прежний образ держал её
      # на 9001 (порт выше проброшен на loopback) — сохраняем поведение.
      MINIO_BROWSER: "on"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      # `mc ready local` требовал алиас, которого в этом образе нет;
      # штатная проверка живости самого сервера, curl есть в образе.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # DRF-2457: бакет НЕ анонимный. Прежнее `mc anonymous set download` делало
  # чтение открытым любому процессу, видящему MinIO, и возвращалось при каждом
  # `compose up`, даже если бакет закрыли руками. Показ идёт по подписанному
  # адресу или через бэкенд — анонимное чтение ему не нужно.
  minio-init:
    # `minio/mc` снят с реестров вместе с сервером (см. `minio` выше); `mc`
    # лежит в том же Bitnami-образе на PATH — второй образ не нужен.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      minio:
        condition: service_healthy
    # The credentials reach the container's shell through its environment
    # (interpolated from the host .env, required like on `minio` above).
    # Previously the shell fell back to the vendor default when the
    # variable was absent inside the container - which it always was.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set it in .env}
      # Процесс идёт от uid 1001 без домашнего каталога; `mc` пишет конфиг
      # алиасов — даём ему каталог, куда он точно может писать.
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/beautygo-media;
      mc anonymous set none local/beautygo-media;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
  redis_data:
  mapping_reports:

# DRF-2996. Секрет сборки для приватного ayla-ai-core. Значение берётся из
# переменной GH_DEPLOY_TOKEN окружения compose: shell, `.env` проекта или
# `--env-file`. На пилоте ci.yml даёт `--env-file ~/.config/beautygo/build.env`
# (0600, вне дерева) только команде `build`; `up` токен не нужен.
secrets:
  gh_deploy_token:
    environment: GH_DEPLOY_TOKEN
