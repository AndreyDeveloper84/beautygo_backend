services:
  web:
    build:
      context: .
      args:
        # DRF-1431. Which registry the base layer comes from. Default is
        # the upstream Docker Hub ref, so a fresh clone / laptop / CI is
        # unchanged. The dev deploy exports PYTHON_BASE_IMAGE=<GHCR ref>
        # before `docker compose build` (ci.yml step 2/4) because the
        # pilot VPS reaches Hub badly — see the comment block at the top
        # of the Dockerfile for the measurements.
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        # Forwards GH_DEPLOY_TOKEN from the host env into the build for
        # the ayla-ai-core clone (DRF-242 post-merge ops fix, 2026-05-07).
        # It is OPTIONAL: that repo is public (owner's decision
        # 04.09.2026, OPEN_DECISIONS.md §22 in the workspace root), so
        # empty / unset on the host is the normal case — the Dockerfile
        # skips the git config
        # and pip clones the pinned SHA anonymously. Kept wired so the
        # authenticated path revives untouched if the visibility is closed
        # again (DRF-1466).
        GH_DEPLOY_TOKEN: ${GH_DEPLOY_TOKEN:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=djangoProject.settings.prod
      - REDIS_URL=redis://redis:6379
    volumes:
      - /home/taximeter/beautygo/dev/staticfiles:/app/staticfiles
      - /home/taximeter/beautygo/dev/media:/app/media
      # Firebase Service Account JSON. CI deploy writes the file (empty
      # iff secret unset → PushService stays in stub mode), so the bind
      # mount always resolves. Read-only inside the container — the
      # process never writes back.
      - ./firebase-admin.json:/app/firebase-admin.json:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: .
      # DRF-1431: same base-image indirection as `web`. Without it two of
      # the three services named in ci.yml's `docker compose build` would
      # still resolve python:3.12-slim from Docker Hub, and the deploy
      # would keep failing exactly where it failed on 2026-08-31.
      #
      # GH_DEPLOY_TOKEN is deliberately NOT added here: this service has
      # always built without it and does so successfully today (verified
      # on the pilot 2026-08-31 — dev-celery_worker:latest builds clean).
      # Adding it would change what pip is authenticated as, which is a
      # separate question from this ticket. DRF-1466 explains why it is
      # not needed at all: ayla-ai-core is public and clones anonymously.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=djangoProject.settings.prod
      - REDIS_URL=redis://redis:6379
    command: celery -A djangoProject worker --loglevel=info --concurrency=2
    volumes:
      - ./firebase-admin.json:/app/firebase-admin.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      # DRF-1431 — see celery_worker above.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=djangoProject.settings.prod
      - REDIS_URL=redis://redis:6379
    # Default PersistentScheduler reads CELERY_BEAT_SCHEDULE from settings.
    # State is kept in /tmp/celerybeat-schedule (lost on container recreate
    # but harmless — beat recomputes fire times on start).
    command: celery -A djangoProject beat --loglevel=info
    volumes:
      - ./firebase-admin.json:/app/firebase-admin.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautygo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautygo}
      POSTGRES_DB: ${POSTGRES_DB:-beautygo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beautygo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/beautygo-media;
      mc anonymous set download local/beautygo-media;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
  redis_data:
