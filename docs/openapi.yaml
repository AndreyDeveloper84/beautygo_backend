  # ─── AI 🟢 ────────────────────────────────────────────

  /ai/chat/:
    post:
      tags: [ai]
      summary: Отправить сообщение AI
      description: |
        Если conversation_id не указан — создаётся новый диалог.
        Ответ может содержать action с данными для UI.

        Типы action:
        - show_specialists: рекомендации мастеров с match_score и причинами
        - show_slots: доступные слоты для выбранного мастера
        - confirm_booking: подтверждение бронирования
        - show_appointments: показать записи
        - ask_clarification: уточняющий вопрос с подсказками
      operationId: ai_chat
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: Ответ AI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many requests
        '503':
          description: AI недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: AI_UNAVAILABLE
                  message: AI service is temporarily unavailable

  /ai/chat/{conversation_id}/action/:
    post:
      tags: [ai]
      summary: Подтвердить/отклонить действие AI
      operationId: ai_action_confirm
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIActionConfirmRequest'
      responses:
        '200':
          description: Действие обработано
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                      result:
                        type: object
                        properties:
                          appointment:
                            $ref: '#/components/schemas/Appointment'
                            nullable: true
                          next_message:
                            $ref: '#/components/schemas/AIMessage'
                            nullable: true
                          next_action:
                            $ref: '#/components/schemas/AIAction'
                            nullable: true

  /ai/conversations/:
    get:
      tags: [ai]
      summary: История диалогов
      operationId: ai_conversations_list
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Список диалогов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIConversation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /ai/conversations/{id}/:
    get:
      tags: [ai]
      summary: Диалог с сообщениями
      operationId: ai_conversations_detail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Диалог
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/AIMessage'
                      created_at:
                        type: string
                        format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [ai]
      summary: Удалить диалог
      operationId: ai_conversations_delete
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '204':
          description: Удалено

  # ─── HEALTH ────────────────────────────────────────────

  /health/:
    get:
      tags: [health]
      summary: Health check
      operationId: health_check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                    example: "1.0.0"
                  timestamp:
                    type: string
                    format: date-time

  /health/ready/:
    get:
      tags: [health]
      summary: Readiness check
      operationId: health_ready
      responses:
        '200':
          description: Все сервисы доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
                  cache:
                    type: string
                    example: connected
                  ai:
                    type: string
                    example: available
