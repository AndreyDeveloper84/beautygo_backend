  # ─── APPOINTMENTS ⚪ ───────────────────────────────────

  /appointments/:
    post:
      tags: [appointments]
      summary: Создать запись
      operationId: appointments_create
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
      responses:
        '201':
          description: Запись создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentWithDetails'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                slot_taken:
                  value:
                    error:
                      code: SLOT_NOT_AVAILABLE
                      message: This time slot is already taken or blocked
                invalid_time:
                  value:
                    error:
                      code: INVALID_DATETIME
                      message: Booking must be at least 1 hour in advance
                duplicate:
                  value:
                    error:
                      code: DUPLICATE_APPOINTMENT
                      message: You already have an appointment at this time

    get:
      tags: [appointments]
      summary: Мои записи
      operationId: appointments_list
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled, no_show]
          description: Можно передать несколько через запятую
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: upcoming
          in: query
          schema:
            type: boolean
          description: Только будущие
      responses:
        '200':
          description: Список записей
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentWithDetails'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /appointments/{id}/:
    get:
      tags: [appointments]
      summary: Детали записи
      operationId: appointments_detail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Детали записи
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentWithDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments/{id}/status/:
    patch:
      tags: [appointments]
      summary: Изменить статус записи
      description: |
        Допустимые переходы:
        - pending → confirmed (мастер)
        - pending → cancelled (клиент, мастер)
        - confirmed → cancelled (клиент, мастер)
        - confirmed → completed (мастер)
        - confirmed → no_show (мастер)

        Политика отмены:
        - За 24+ часов: бесплатно
        - За 2-24 часа: 50% стоимости
        - За менее 2 часов: 100% стоимости
      operationId: appointments_status_update
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/UUIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentStatusUpdate'
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
        '400':
          description: Недопустимый переход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_transition:
                  value:
                    error:
                      code: INVALID_STATUS_TRANSITION
                      message: Cannot transition from completed to cancelled
                too_late:
                  value:
                    error:
                      code: CANCELLATION_TOO_LATE
                      message: Cannot cancel less than 2 hours before appointment
        '403':
          description: Нет прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_ALLOWED
                  message: Only specialist can confirm appointments

  /appointments/{id}/reschedule/:
    patch:
      tags: [appointments]
      summary: Перенести запись
      description: Переносит запись на новое время. Статус сбрасывается на pending.
      operationId: appointments_reschedule
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/UUIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: Запись перенесена
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
        '400':
          description: Слот недоступен или слишком поздно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /appointments/manual/:
    post:
      tags: [appointments]
      summary: "🟣 Ручное добавление записи мастером"
      description: |
        Только для Ayla Pro. Мастер создаёт запись вручную.
        Если клиента с таким телефоном нет в системе, запись создаётся
        с указанными client_name/client_phone без привязки к user.
      operationId: appointments_manual_create
