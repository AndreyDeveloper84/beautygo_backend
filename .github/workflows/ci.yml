name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against tracked db.sqlite3
        # Per issue #420 / Phase 0 Bucket 3: db.sqlite3 is a dev artifact
        # and must not be re-added to git. Fail the PR if any sqlite dev DB
        # shows up in the tracked tree (covers -journal/-wal/-shm too).
        run: |
          matches=$(git ls-files | grep -E '(^|/)db\.sqlite3(-(journal|wal|shm))?$' || true)
          if [ -n "$matches" ]; then
            echo "::error::db.sqlite3 must not be tracked. See issue #420 and .gitignore."
            echo "Offending paths:"
            echo "$matches"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install flake8 detect-secrets==1.5.0

      - name: Run flake8
        run: flake8 .

      - name: Sensitive filename guard
        # DRF-1243 / W0-X1: refuses credential-bearing filenames (.env,
        # *.pem, *service-account*.json, ...) even when entropy scanning
        # would not flag them. Paths only — never reads file contents.
        run: python scripts/sensitive_file_guard.py --all

      - name: detect-secrets (baseline audit)
        # detect-secrets-hook is the gating entry point: it exits
        # non-zero on any scanned secret not recorded in the baseline
        # (plain `scan --baseline` does not gate). File set mirrors the
        # pre-commit hook's `exclude` so CI and local rules stay
        # compatible. The pragma on the `run:` line marks the pinned
        # package spec, which trips the Secret Keyword heuristic (the
        # allowlist filter anchors on the YAML block's opening line).
        run: |  # pragma: allowlist secret
          git ls-files \
            | grep -vE '^(\.secrets\.baseline|.*\.lock)$' \
            | xargs detect-secrets-hook --baseline .secrets.baseline

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        # POSTGRES_DB=beautygo matches settings.dev/test defaults so
        # pytest-django creates test_beautygo via Django's default
        # `test_<NAME>` convention. POSTGRES_USER=postgres is the
        # superuser (has CREATEDB) so the per-test schema build works.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beautygo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Configure git auth for private dependency
        # requirements.txt pulls ayla-ai-core from a sibling private repo
        # (AndreyDeveloper84/ayla-ai-core). The default GITHUB_TOKEN only
        # has read access to the current repo, so cloning siblings needs
        # the same deploy token used by the deploy step. URL-rewriting
        # makes pip's git clone authenticate transparently.
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          git config --global url."https://${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Use settings.test — overrides cache to LocMem and forces
          # CELERY_TASK_ALWAYS_EAGER=True. Real Redis is provisioned as
          # a service for the @pytest.mark.integration suite.
          DJANGO_SETTINGS_MODULE: djangoProject.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          # Postgres connection — points at the `postgres` service
          # container above. Settings.dev/.test honour these env vars
          # (issue #422); without them DATABASES['default']['HOST']
          # falls back to 'localhost' anyway, but we set them
          # explicitly so a future settings refactor doesn't silently
          # change the connection target.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beautygo
          # Observability: keep SDKs explicitly inert in CI. Empty DSN
          # = sentry no-op; human log format keeps CI output readable.
          SENTRY_DSN: ''
          SENTRY_ENVIRONMENT: ci
          LOG_FORMAT: human
          LOG_LEVEL: INFO
          # Available for the optional integration suite. Default tests
          # use LocMemCache via settings.test, so REDIS_URL only matters
          # when someone runs `pytest -m integration`.
          REDIS_URL: redis://localhost:6379
        run: pytest --tb=short -q

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: djangoProject.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beautygo
          SENTRY_DSN: ''
          REDIS_URL: redis://localhost:6379
        run: python manage.py check

  # ---------------------------------------------------------------------------
  # deploy — DRF-1363. Rebuilt so that an abort can never take the pilot's
  # database with it.
  #
  # ## What happened on 2026-08-24 (run 32708667905)
  #
  # One SSH action did everything: git fetch, docker build, and
  # `docker compose up -d --force-recreate` with NO service list. The
  # timeline from that run's log:
  #
  #   09:12:18  ssh command starts
  #   09:16:28  `git fetch origin dev` finally returns      (4m10s)
  #   09:17:16  `docker compose build` starts
  #   09:26:21  web / celery_beat / celery_worker  Built    (9m05s)
  #   09:26:32  Container dev-db-1     Recreate
  #             Container dev-minio-1  Recreate
  #             Container dev-redis-1  Recreate
  #   09:27:30  Run Command Timeout — command_timeout: 15m exhausted
  #
  # Fetch + build consumed 14m03s of a 15m budget. The recreate of the
  # STORAGE tier got the remaining 58 seconds, and was killed inside it.
  # db / redis / minio were left `Created` — created, never started. `web`
  # kept serving on yesterday's image with no database behind it, and the
  # pilot answered
  #     psycopg2.OperationalError: could not translate host name "db"
  # for the next ~7 hours until it was started by hand.
  #
  # ## The three defects, and what replaces each
  #
  # 1. The storage tier was in the blast radius of a code deploy.
  #    `up -d --force-recreate` with no service list recreates EVERY
  #    service, db included. A code deploy has no business stopping
  #    postgres. Fixed by scoping the recreate to the application tier
  #    with `--no-deps` (step 3/4) and touching db / redis / minio only
  #    with `--no-recreate`, which starts a stopped container and never
  #    replaces a running one.
  #
  # 2. Build and restart shared one timeout, so the timeout landed inside
  #    the restart. Split into separate SSH steps with separate budgets.
  #    The guarantee is NOT that the numbers are now large enough — build
  #    time grows with the project and will exceed any number eventually.
  #    The guarantee is that an overrun in the long step (2/4, the build)
  #    stops before a single container has been touched, so the running
  #    contour is bit-for-bit what it was before the deploy started.
  #
  # 3. Nothing made a live request afterwards, and nothing said a word.
  #    The old script's only post-deploy gate was
  #    `docker compose exec web manage.py showmigrations --plan`, which
  #    (a) is not a request through the serving stack and (b) sat AFTER
  #    the recreate, so an abort during the recreate skipped it entirely.
  #    Replaced by step 4/4: a real HTTP GET of /api/v1/health/ready/
  #    (djangoProject/health.py), which returns 503 unless the database
  #    answers `SELECT 1`, the cache round-trips, and the migration plan
  #    is empty. On 2026-08-24 that request would have returned 503 with
  #    `"db": {"ok": false}` roughly one minute in. It subsumes the old
  #    migration-settle loop — `_check_migrations` runs the same
  #    MigrationExecutor plan the loop grepped for — and adds the two
  #    checks the loop had no opinion about.
  #    Two more steps close the silence: a failure-only step that dumps
  #    state and brings anything that is down back up, and a Telegram
  #    ping (same runner-side pattern as smoke-on-dev.yml, whose egress
  #    to api.telegram.org is clean where the VPS's is not).
  #
  # ## What an abort in the same place costs now
  #
  # Step 3/4 is the only step that stops a container, and the only
  # containers it can stop are web / celery_worker / celery_beat. db,
  # redis and minio are never arguments to a recreate, so no abort at any
  # point in this job can leave the pilot without a database. Killed
  # mid-recreate the worst case is `web` absent for as long as the
  # failure-only step takes to run `up -d --no-recreate` — and the job
  # still ends red, with the reason in the log and a Telegram ping out.
  #
  # ## Volumes
  #
  # No step here removes a volume. `down` in any form does not appear in
  # this job, and must not: the pilot's data lives in `dev_postgres_data`.
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev
    timeout-minutes: 50
    # One deploy at a time against one box. Two overlapping runs would
    # interleave one's `git reset --hard` with the other's
    # `docker compose build` on the same checkout. Queue instead of
    # cancelling: a cancelled run is a run aborted at an arbitrary point,
    # which is the class of event this job is built to survive, not invite.
    concurrency:
      group: deploy-dev-vps
      cancel-in-progress: false

    steps:
      # ---- 1/4 -----------------------------------------------------------
      # Source + CI-managed env only. No container is created, stopped or
      # recreated here, so any failure — including the 4-minute `git fetch`
      # blowing its budget — leaves the running contour untouched.
      - name: 1/4 Sync source + CI-managed env on the dev VPS
        uses: appleboy/ssh-action@v1
        env:
          # Sentry config managed by CI, not by hand-editing .env on the box.
          # SENTRY_DSN is a repo secret (GitHub → Settings → Secrets and variables
          # → Actions); empty value = SDK no-op, safe default.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: development
          SENTRY_RELEASE: ${{ github.sha }}
          # DJANGO_ENV gates prod.py fail-fast strictness. dev VPS uses prod
          # settings (HSTS, S3 storage, JSON logs) but doesn't yet have all
          # OAuth / YooKassa creds provisioned, so "staging" downgrades the
          # missing-env error to a warning (see core/env_strictness.py).
          # Real production VPS deploy step must override to "production".
          DJANGO_ENV: staging
          # Firebase Service Account JSON. Empty value → PushService runs
          # in stub mode (logs payload, returns success) — same no-op
          # pattern as Sentry. Set via GitHub Secrets to enable real FCM.
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          # `git fetch` from this box measured 4m10s on 2026-08-24 (RU
          # egress to github.com). 10m is headroom for that, and a
          # timeout here is a clean no-op.
          command_timeout: 10m
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_RELEASE,DJANGO_ENV,FIREBASE_CREDENTIALS_JSON
          script: |
            set -eo pipefail
            cd /home/taximeter/beautygo/dev

            # Configure git auth via deploy token (HTTPS)
            git remote set-url origin https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/AndreyDeveloper84/beautygo_backend.git

            git fetch origin dev
            git reset --hard origin/dev
            echo "checkout now at $(git rev-parse --short HEAD)"

            # Refresh CI-managed env vars in .env without disturbing the rest.
            # Idempotent: drop any existing line for these keys, then append
            # the current value. Empty SENTRY_DSN is fine — base.py treats it
            # as "no Sentry" and skips init.
            touch .env
            sed -i \
              -e '/^SENTRY_DSN=/d' \
              -e '/^SENTRY_ENVIRONMENT=/d' \
              -e '/^SENTRY_RELEASE=/d' \
              -e '/^DJANGO_ENV=/d' \
              -e '/^FIREBASE_CREDENTIALS_PATH=/d' \
              .env
            {
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
              echo "SENTRY_RELEASE=$SENTRY_RELEASE"
              echo "DJANGO_ENV=$DJANGO_ENV"
              echo "FIREBASE_CREDENTIALS_PATH=/app/firebase-admin.json"
            } >> .env

            # Firebase Service Account JSON → bind-mounted file. Touch
            # first so the docker-compose mount succeeds even when the
            # secret is empty (PushService treats a zero-byte file as
            # "no creds" and falls into stub mode).
            touch firebase-admin.json
            chmod 600 firebase-admin.json
            if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
              printf '%s' "$FIREBASE_CREDENTIALS_JSON" > firebase-admin.json
            fi

      # ---- 2/4 -----------------------------------------------------------
      # The long step, and deliberately the harmless one. `build` writes
      # images; it does not stop, start or replace a container. The three
      # named services are exactly the ones with a `build:` section in
      # docker-compose.yml — naming them makes it impossible for a future
      # storage service to acquire a build stanza and quietly join a code
      # deploy.
      #
      # ## DRF-1431 — why the base image no longer comes from Docker Hub
      #
      # This step builds ON THE VPS, not on the runner. That is the whole
      # reason the 2026-08-31 outage was possible: two consecutive deploys
      # died here, before a line of project code was compiled, at
      #
      #   #4 ERROR: failed to authorize: failed to fetch anonymous token:
      #        Get "https://auth.docker.io/token?scope=repository%3Alibrary..."
      #   failed to run Build function: python:3.12-slim: failed to resolve
      #        source metadata for docker.io/library/python:3.12-slim
      #
      # Lint and tests were green. The build never got as far as our code.
      #
      # Measured from the pilot the same day: no daemon.json, no
      # docker.service.d drop-in, no proxy in ~/.docker/config.json, and a
      # manual `docker pull python:3.12-slim` succeeding first try — so
      # nothing on the box was at fault. Registry latency from that IP:
      #
      #   ghcr.io/v2/               401 in 0.26s / 0.31s / 0.26s  (3 of 3)
      #   registry-1.docker.io/v2/  401 in 5.41s
      #   auth.docker.io/token      200 on probe, but had refused twice
      #                             inside the deploy hours earlier
      #
      # Intermittent refusal of the ANONYMOUS token endpoint, with the
      # network otherwise healthy, is the signature of anonymous-pull rate
      # limiting. It is not a thing this repo can retry its way out of, and
      # "I pulled it by hand" only holds until the next image prune.
      #
      # So the base layer now comes from GHCR — the registry this deploy
      # already depends on (step 1/4 fetches source from GitHub over the
      # same egress) and which answers 20x faster. The mirror is a
      # digest-identical copy of the upstream image, refreshed by
      # .github/workflows/mirror-base-image.yml on a GitHub runner, where
      # Hub connectivity is good. Hub is moved off the deploy's critical
      # path rather than merely retried.
      #
      # Nothing here can make the deploy worse than it was: every way of
      # obtaining the base image is tried in order of preference and the
      # last one is the old behaviour. And this step still touches no
      # container, so a failure at any point leaves the pilot as it was.
      - name: 2/4 Build application images (running contour untouched)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          # 9m05s on 2026-08-24 and rising with the project. This number
          # is not the fix and is not load-bearing: overrunning it now
          # aborts before any container has been touched, which is the
          # entire point of splitting this step out. When builds outgrow
          # 20m, raise it — or better, move the build to the runner and
          # ship an image — without any of that being an incident.
          command_timeout: 20m
          script: |
            set -eo pipefail
            cd /home/taximeter/beautygo/dev

            # --- where the base layer comes from (DRF-1431) --------------
            # The Dockerfile's `ARG PYTHON_BASE_IMAGE=` line is the single
            # source of truth for which base image and which tag; read it
            # rather than repeating it, so the two can never drift.
            UPSTREAM=$(grep -m1 -E '^ARG PYTHON_BASE_IMAGE=' Dockerfile | cut -d= -f2- || true)
            UPSTREAM=${UPSTREAM:-python:3.12-slim}
            OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            MIRROR="ghcr.io/${OWNER}/beautygo-python:${UPSTREAM##*:}"
            echo "upstream=$UPSTREAM  mirror=$MIRROR"

            try_pull() {
              for a in 1 2 3; do
                if docker pull "$1" >/dev/null 2>&1; then return 0; fi
                echo "  pull $1 — attempt $a/3 failed"
                sleep $((a * 10))
              done
              return 1
            }

            # Preference order. Every branch is strictly better than the
            # one below it, and the bottom branch is exactly what this
            # step did before DRF-1431 — so this can only add options.
            BASE=""
            if try_pull "$MIRROR"; then
              BASE="$MIRROR"; SOURCE="ghcr (anonymous)"
            elif grep -q '^GH_DEPLOY_TOKEN=' .env 2>/dev/null; then
              # The package is private (public is the recommended setup —
              # it is a copy of a public image and needs no secret). Log in
              # with the token ALREADY on this box; nothing new is written
              # here that was not here before, and the value is never
              # echoed. Needs `read:packages` on the token.
              echo "anonymous GHCR pull failed — trying an authenticated one"
              if grep -m1 '^GH_DEPLOY_TOKEN=' .env | cut -d= -f2- \
                   | docker login ghcr.io -u "$OWNER" --password-stdin >/dev/null 2>&1 \
                 && try_pull "$MIRROR"; then
                BASE="$MIRROR"; SOURCE="ghcr (authenticated)"
              fi
            fi
            if [ -z "$BASE" ] && docker image inspect "$MIRROR" >/dev/null 2>&1; then
              # GHCR unreachable but a previous deploy left the mirror in
              # the local image store. BuildKit resolves a locally present
              # image without a registry round trip, so this builds offline.
              BASE="$MIRROR"; SOURCE="local copy of the mirror"
            fi
            if [ -z "$BASE" ] && docker image inspect "$UPSTREAM" >/dev/null 2>&1; then
              BASE="$UPSTREAM"; SOURCE="local copy of the upstream image"
            fi
            if [ -z "$BASE" ]; then
              echo "::warning::falling back to Docker Hub for $UPSTREAM — this is the path that failed on 2026-08-31. Check that the GHCR mirror exists and is pullable (workflow: mirror-base-image)."
              BASE="$UPSTREAM"; SOURCE="docker hub (fallback)"
            fi

            export PYTHON_BASE_IMAGE="$BASE"
            echo "building on $PYTHON_BASE_IMAGE  — source: $SOURCE"
            # Provenance for the run log: the exact bytes we built on.
            docker image inspect --format '{{index .RepoDigests 0}}' "$BASE" 2>/dev/null \
              || echo "(no repo digest recorded for $BASE)"

            # --- the build ----------------------------------------------
            # Retry is deliberately the junior partner here: the pull above
            # is what takes Hub off the critical path, and this only covers
            # a transient that slips past it. Bounded by BOTH attempts and
            # wall clock so it can never turn one slow build into three —
            # and overrunning this step is a clean no-op by design (see the
            # header comment on the deploy job).
            started=$SECONDS
            attempt=1
            while :; do
              if docker compose build web celery_worker celery_beat; then
                break
              fi
              elapsed=$((SECONDS - started))
              if [ "$attempt" -ge 3 ] || [ "$elapsed" -ge 900 ]; then
                echo "::error::build failed after ${attempt} attempt(s) in ${elapsed}s"
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "build failed — retrying (attempt ${attempt}/3, ${elapsed}s elapsed)"
              sleep 20
            done

      # ---- 3/4 -----------------------------------------------------------
      # The only step that stops anything, now scoped to the application
      # tier and fast because the images already exist.
      - name: 3/4 Restart application containers only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 6m
          script: |
            set -eo pipefail
            cd /home/taximeter/beautygo/dev

            # Storage tier: start what is down, replace nothing.
            # `--no-recreate` is the opposite of what killed the pilot —
            # a running db is left strictly alone, and a db left in
            # `Created` by an earlier accident is started. It is also
            # deliberately conservative: a change to db/redis/minio in
            # docker-compose.yml will NOT be applied by a deploy. Storage
            # config changes are an operator action, on purpose.
            docker compose up -d --no-recreate db redis minio

            # Application tier. `--no-deps` is why this cannot reach the
            # storage tier: without it, compose walks web's `depends_on`
            # (db, redis, minio) and pulls them into the recreate.
            # `--force-recreate` is kept so new .env values (SENTRY_*,
            # DJANGO_ENV) actually reach the processes.
            docker compose up -d --force-recreate --no-deps web celery_worker celery_beat

            docker compose ps

      # ---- 4/4 -----------------------------------------------------------
      # Live request through the real serving stack. This is the step that
      # tells "deployed" apart from "working".
      - name: 4/4 Smoke — live readiness request against the pilot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 8m
          script: |
            set -eo pipefail
            cd /home/taximeter/beautygo/dev

            # web publishes on 127.0.0.1:8000 only (docker-compose.yml),
            # so the probe runs on the box. settings.prod builds
            # ALLOWED_HOSTS from DJANGO_ALLOWED_HOSTS, and a request with
            # `Host: 127.0.0.1` against a host list that does not include
            # it comes back 400 DisallowedHost — a red smoke over a
            # perfectly healthy contour. So borrow the box's own first
            # configured hostname for the Host header. A hostname is not
            # a secret; nothing else is read out of .env here.
            HOST_HEADER=$(grep -m1 '^DJANGO_ALLOWED_HOSTS=' .env 2>/dev/null \
              | cut -d= -f2- | tr ',' '\n' | grep -v '^[*]$' | head -n1 | tr -d '[:space:]' || true)
            if [ -z "$HOST_HEADER" ]; then HOST_HEADER=127.0.0.1; fi
            echo "probing http://127.0.0.1:8000/api/v1/health/ready/ with Host: $HOST_HEADER"

            # /api/v1/health/ready/ answers 200 only when SELECT 1
            # succeeds, the cache round-trips, and the migration plan is
            # empty; 503 with a per-check JSON body otherwise (see
            # djangoProject/health.py). Connection-refused while the
            # entrypoint runs migrate + collectstatic is expected and
            # shows as http=000 — keep waiting. 120 x 6s = 12 minutes.
            #
            # Почему 12, а не 4 (замер 30.08). Проход по merge PR #264
            # покраснел на этом шаге при ПОЛНОСТЬЮ ЗДОРОВОМ пилоте:
            #
            #   06:21:49  шаг начал ждать
            #   06:25:54  сдался через 244 с — в логе «Applying migrations…»
            #   06:31:25  gunicorn: Listening at http://0.0.0.0:8000
            #
            # То есть не хватило ещё 5.5 минут: entrypoint гонит migrate +
            # collectstatic, и на боевой базе это дольше четырёх минут.
            # Проверено вручную сразу после: readiness отдаёт 200 с телом
            # {"db":ok,"cache":ok,"migrations":"applied"} — контур был жив
            # всё это время.
            #
            # Красный деплой при рабочем пилоте хуже отсутствующей проверки:
            # он приучает не смотреть на красное. Один такой прогон уже
            # стоил часа диагностики и ложного вывода «пилот лежит».
            for i in $(seq 1 120); do
              code=$(curl -sS -m 10 -o /tmp/drf1363_ready.json -w '%{http_code}' \
                -H "Host: $HOST_HEADER" \
                http://127.0.0.1:8000/api/v1/health/ready/ 2>/dev/null || echo 000)
              if [ "$code" = "200" ]; then
                echo "readiness 200 — pilot is serving:"
                cat /tmp/drf1363_ready.json; echo
                rm -f /tmp/drf1363_ready.json
                echo "Deploy complete!"
                exit 0
              fi
              echo "readiness not green (attempt $i/120, http=$code)"
              if [ -s /tmp/drf1363_ready.json ]; then
                head -c 400 /tmp/drf1363_ready.json; echo
              fi
              sleep 6
            done

            echo "::error::readiness red after 12 minutes — the deploy is NOT live. Checks below."
            if [ -s /tmp/drf1363_ready.json ]; then
              echo "last readiness body:"; head -c 800 /tmp/drf1363_ready.json; echo
            fi
            rm -f /tmp/drf1363_ready.json
            docker compose ps
            docker compose logs --tail 60 web || true
            exit 1

      # ---- failure only --------------------------------------------------
      # An aborted deploy must not also be an outage. Prints what state
      # the box is actually in, then starts anything that is down —
      # `--no-recreate` so this can only ever add, never replace. This is
      # the automated form of the manual recovery that ended the
      # 2026-08-24 incident.
      - name: Diagnose and bring anything that is down back up
        if: failure()
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 8m
          script: |
            cd /home/taximeter/beautygo/dev
            echo "=== state as the failed deploy left it ==="
            docker compose ps -a
            echo
            echo "=== start whatever is down (never recreate, never remove) ==="
            docker compose up -d --no-recreate
            echo
            docker compose ps
            echo
            echo "=== readiness after recovery (informational) ==="
            HOST_HEADER=$(grep -m1 '^DJANGO_ALLOWED_HOSTS=' .env 2>/dev/null \
              | cut -d= -f2- | tr ',' '\n' | grep -v '^[*]$' | head -n1 | tr -d '[:space:]' || true)
            if [ -z "$HOST_HEADER" ]; then HOST_HEADER=127.0.0.1; fi
            curl -sS -m 10 -o - -w '\nhttp=%{http_code}\n' -H "Host: $HOST_HEADER" \
              http://127.0.0.1:8000/api/v1/health/ready/ || echo "readiness unreachable"
            echo
            echo "=== web logs (tail 60) ==="
            docker compose logs --tail 60 web || true

      - name: Notify on failure (Telegram, runner-side)
        # The 2026-08-24 deploy went red and nobody was told; the owner
        # found the outage, not the pipeline. Runner-side because RKN
        # egress filtering blocks api.telegram.org from the RU VPS — the
        # same reason smoke-on-dev.yml alerts from the runner. Skips
        # silently when either secret is unset, so an unconfigured repo
        # gets no false alarms.
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "No TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret — skipping alert."
            echo "Configure both secrets at repo level to enable deploy-failure pings."
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG=$'\xf0\x9f\x94\xa5 <b>dev deploy failed</b>\n'
          MSG+="Commit: <code>${SHA_SHORT}</code>"$'\n'
          MSG+='Storage tier untouched — db/redis/minio are never recreated by a deploy.'$'\n'
          MSG+="<a href=\"${RUN_URL}\">Open run</a>"
          curl -sS --max-time 10 -o /tmp/tg_resp.json -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" \
            || { echo "curl failed; alert dropped"; exit 0; }
          echo "telegram response: $(head -c 200 /tmp/tg_resp.json)"
          rm -f /tmp/tg_resp.json
