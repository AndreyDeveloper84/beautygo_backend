name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against tracked db.sqlite3
        # Per issue #420 / Phase 0 Bucket 3: db.sqlite3 is a dev artifact
        # and must not be re-added to git. Fail the PR if any sqlite dev DB
        # shows up in the tracked tree (covers -journal/-wal/-shm too).
        run: |
          matches=$(git ls-files | grep -E '(^|/)db\.sqlite3(-(journal|wal|shm))?$' || true)
          if [ -n "$matches" ]; then
            echo "::error::db.sqlite3 must not be tracked. See issue #420 and .gitignore."
            echo "Offending paths:"
            echo "$matches"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install flake8 detect-secrets==1.5.0

      - name: Run flake8
        run: flake8 .

      - name: Sensitive filename guard
        # DRF-1243 / W0-X1: refuses credential-bearing filenames (.env,
        # *.pem, *service-account*.json, ...) even when entropy scanning
        # would not flag them. Paths only — never reads file contents.
        run: python scripts/sensitive_file_guard.py --all

      - name: detect-secrets (baseline audit)
        # detect-secrets-hook is the gating entry point: it exits
        # non-zero on any scanned secret not recorded in the baseline
        # (plain `scan --baseline` does not gate). File set mirrors the
        # pre-commit hook's `exclude` so CI and local rules stay
        # compatible. The pragma on the `run:` line marks the pinned
        # package spec, which trips the Secret Keyword heuristic (the
        # allowlist filter anchors on the YAML block's opening line).
        run: |  # pragma: allowlist secret
          git ls-files \
            | grep -vE '^(\.secrets\.baseline|.*\.lock)$' \
            | xargs detect-secrets-hook --baseline .secrets.baseline

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        # POSTGRES_DB=beautygo matches settings.dev/test defaults so
        # pytest-django creates test_beautygo via Django's default
        # `test_<NAME>` convention. POSTGRES_USER=postgres is the
        # superuser (has CREATEDB) so the per-test schema build works.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beautygo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Configure git auth for private dependency
        # requirements.txt pulls ayla-ai-core from a sibling private repo
        # (AndreyDeveloper84/ayla-ai-core). The default GITHUB_TOKEN only
        # has read access to the current repo, so cloning siblings needs
        # the same deploy token used by the deploy step. URL-rewriting
        # makes pip's git clone authenticate transparently.
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          git config --global url."https://${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Use settings.test — overrides cache to LocMem and forces
          # CELERY_TASK_ALWAYS_EAGER=True. Real Redis is provisioned as
          # a service for the @pytest.mark.integration suite.
          DJANGO_SETTINGS_MODULE: djangoProject.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          # Postgres connection — points at the `postgres` service
          # container above. Settings.dev/.test honour these env vars
          # (issue #422); without them DATABASES['default']['HOST']
          # falls back to 'localhost' anyway, but we set them
          # explicitly so a future settings refactor doesn't silently
          # change the connection target.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beautygo
          # Observability: keep SDKs explicitly inert in CI. Empty DSN
          # = sentry no-op; human log format keeps CI output readable.
          SENTRY_DSN: ''
          SENTRY_ENVIRONMENT: ci
          LOG_FORMAT: human
          LOG_LEVEL: INFO
          # Available for the optional integration suite. Default tests
          # use LocMemCache via settings.test, so REDIS_URL only matters
          # when someone runs `pytest -m integration`.
          REDIS_URL: redis://localhost:6379
        run: pytest --tb=short -q

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: djangoProject.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beautygo
          SENTRY_DSN: ''
          REDIS_URL: redis://localhost:6379
        run: python manage.py check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev

    steps:
      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Sentry config managed by CI, not by hand-editing .env on the box.
          # SENTRY_DSN is a repo secret (GitHub → Settings → Secrets and variables
          # → Actions); empty value = SDK no-op, safe default.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: development
          SENTRY_RELEASE: ${{ github.sha }}
          # DJANGO_ENV gates prod.py fail-fast strictness. dev VPS uses prod
          # settings (HSTS, S3 storage, JSON logs) but doesn't yet have all
          # OAuth / YooKassa creds provisioned, so "staging" downgrades the
          # missing-env error to a warning (see core/env_strictness.py).
          # Real production VPS deploy step must override to "production".
          DJANGO_ENV: staging
          # Firebase Service Account JSON. Empty value → PushService runs
          # in stub mode (logs payload, returns success) — same no-op
          # pattern as Sentry. Set via GitHub Secrets to enable real FCM.
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          # Docker build on the dev VPS regularly exceeds 5m: ayla-ai-core
          # is a private git+https package (no wheel cache), so a layer
          # invalidation triggers a fresh clone + install every time. The
          # 5m cap raced the docker compose build step and timed out
          # before the deploy could ack — see the 5x failures on the
          # Block A merges (runs 26719649094-26719655346, all hit
          # "Run Command Timeout" at ~5min). 15m gives docker enough
          # headroom without letting a genuinely stuck deploy hang
          # forever.
          command_timeout: 15m
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_RELEASE,DJANGO_ENV,FIREBASE_CREDENTIALS_JSON
          script: |
            cd /home/taximeter/beautygo/dev

            # Configure git auth via deploy token (HTTPS)
            git remote set-url origin https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/AndreyDeveloper84/beautygo_backend.git

            git fetch origin dev
            git reset --hard origin/dev

            # Refresh CI-managed env vars in .env without disturbing the rest.
            # Idempotent: drop any existing line for these keys, then append
            # the current value. Empty SENTRY_DSN is fine — base.py treats it
            # as "no Sentry" and skips init.
            touch .env
            sed -i \
              -e '/^SENTRY_DSN=/d' \
              -e '/^SENTRY_ENVIRONMENT=/d' \
              -e '/^SENTRY_RELEASE=/d' \
              -e '/^DJANGO_ENV=/d' \
              -e '/^FIREBASE_CREDENTIALS_PATH=/d' \
              .env
            {
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
              echo "SENTRY_RELEASE=$SENTRY_RELEASE"
              echo "DJANGO_ENV=$DJANGO_ENV"
              echo "FIREBASE_CREDENTIALS_PATH=/app/firebase-admin.json"
            } >> .env

            # Firebase Service Account JSON → bind-mounted file. Touch
            # first so the docker-compose mount succeeds even when the
            # secret is empty (PushService treats a zero-byte file as
            # "no creds" and falls into stub mode).
            touch firebase-admin.json
            chmod 600 firebase-admin.json
            if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
              printf '%s' "$FIREBASE_CREDENTIALS_JSON" > firebase-admin.json
            fi

            docker compose build
            # Bring up the full stack — redis + celery_worker + celery_beat
            # are new in PR3 and would otherwise sit unstarted; --force-recreate
            # on web makes sure new env (REDIS_URL, SENTRY_*) reaches it.
            docker compose up -d --force-recreate

            # DRF-1046. The database does not necessarily accept connections
            # the moment its container starts, so the migrate call used to be
            # guarded with `sleep 5` + `|| true`. That guard made a genuinely
            # broken migration indistinguishable from a merely slow database:
            # the deploy printed "Deploy complete!" either way, and the schema
            # drift surfaced later as runtime errors on the first request that
            # touched a column the running code already expected.
            #
            # Wait for readiness explicitly instead of sleeping. `pg_isready`
            # reports whether the server accepts connections and performs no
            # authentication, so it needs no credentials here.
            for i in $(seq 1 30); do
              docker compose exec -T db pg_isready -q && break
              echo "waiting for db to accept connections ($i/30)"
              sleep 2
            done

            # Migrations are owned by `entrypoint.sh` (line 32), which runs
            # `manage.py migrate --noinput` on every container start. This
            # script must NOT run migrate as well.
            #
            # Why, concretely: on 2026-08-15 it did, and the two raced. The
            # entrypoint created the table, the script's attempt hit
            #   IntegrityError: duplicate key value violates unique constraint
            #   "pg_type_typname_nsp_index"
            #   Key (typname, typnamespace)=(appointments_specialistscheduleexception, …)
            # and the deploy went red over a pilot whose schema was in fact
            # correct — both migrations applied, nothing pending. The race had
            # existed for months, invisible because the `|| true` that this
            # gate replaced swallowed it.
            #
            # So the deploy waits for the entrypoint and then VERIFIES. The
            # verification is the part that must be loud: a schema the running
            # code already expects but the database lacks is worse than no
            # deploy at all, and it surfaces as runtime errors on the first
            # request that touches the new column (the 2026-08-15 bot
            # incident, where containers were healthy and /healthz answered
            # 200 while a required migration sat unapplied).
            #
            # An empty plan means the web container is not answering yet — that
            # is "keep waiting", not "nothing pending". Distinguishing the two
            # is the whole reason this loop tracks `ok` instead of just
            # breaking on an empty grep.
            ok=""
            for i in $(seq 1 60); do
              plan=$(docker compose exec -T web python manage.py showmigrations --plan 2>/dev/null || true)
              if [ -n "$plan" ]; then
                unapplied=$(echo "$plan" | grep '^\[ \]' || true)
                if [ -z "$unapplied" ]; then ok=1; break; fi
              fi
              echo "waiting for entrypoint migrations to finish ($i/60)"
              sleep 5
            done

            if [ -z "$ok" ]; then
              echo "::error::migrations did not settle within 5 minutes"
              docker compose exec -T web python manage.py showmigrations --plan 2>&1 | grep '^\[ \]' || true
              docker compose logs --tail 40 web
              exit 1
            fi

            docker compose ps
            echo "Deploy complete!"
