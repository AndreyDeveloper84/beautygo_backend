name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: djangoProject.settings.dev
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest --tb=short -q

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: djangoProject.settings.dev
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev

    steps:
      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 5m
          script: |
            cd /home/taximeter/beautygo/dev

            # Configure git auth via deploy token (HTTPS)
            git remote set-url origin https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/AndreyDeveloper84/beautygo_backend.git

            git fetch origin dev
            git reset --hard origin/dev
            docker compose build
            docker compose up -d --force-recreate web
            sleep 5
            docker compose exec -T web python manage.py migrate --noinput || true
            docker compose ps
            echo "Deploy complete!"
