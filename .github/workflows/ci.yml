name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against tracked db.sqlite3
        # Per issue #420 / Phase 0 Bucket 3: db.sqlite3 is a dev artifact
        # and must not be re-added to git. Fail the PR if any sqlite dev DB
        # shows up in the tracked tree (covers -journal/-wal/-shm too).
        run: |
          matches=$(git ls-files | grep -E '(^|/)db\.sqlite3(-(journal|wal|shm))?$' || true)
          if [ -n "$matches" ]; then
            echo "::error::db.sqlite3 must not be tracked. See issue #420 and .gitignore."
            echo "Offending paths:"
            echo "$matches"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Configure git auth for private dependency
        # requirements.txt pulls ayla-ai-core from a sibling private repo
        # (AndreyDeveloper84/ayla-ai-core). The default GITHUB_TOKEN only
        # has read access to the current repo, so cloning siblings needs
        # the same deploy token used by the deploy step. URL-rewriting
        # makes pip's git clone authenticate transparently.
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          git config --global url."https://${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Use settings.test — overrides cache to LocMem and forces
          # CELERY_TASK_ALWAYS_EAGER=True. Real Redis is provisioned as
          # a service for the @pytest.mark.integration suite.
          DJANGO_SETTINGS_MODULE: djangoProject.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          # Observability: keep SDKs explicitly inert in CI. Empty DSN
          # = sentry no-op; human log format keeps CI output readable.
          SENTRY_DSN: ''
          SENTRY_ENVIRONMENT: ci
          LOG_FORMAT: human
          LOG_LEVEL: INFO
          # Available for the optional integration suite. Default tests
          # use LocMemCache via settings.test, so REDIS_URL only matters
          # when someone runs `pytest -m integration`.
          REDIS_URL: redis://localhost:6379
        run: pytest --tb=short -q

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: djangoProject.settings.test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          SENTRY_DSN: ''
          REDIS_URL: redis://localhost:6379
        run: python manage.py check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev

    steps:
      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Sentry config managed by CI, not by hand-editing .env on the box.
          # SENTRY_DSN is a repo secret (GitHub → Settings → Secrets and variables
          # → Actions); empty value = SDK no-op, safe default.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: development
          SENTRY_RELEASE: ${{ github.sha }}
          # DJANGO_ENV gates prod.py fail-fast strictness. dev VPS uses prod
          # settings (HSTS, S3 storage, JSON logs) but doesn't yet have all
          # OAuth / YooKassa creds provisioned, so "staging" downgrades the
          # missing-env error to a warning (see core/env_strictness.py).
          # Real production VPS deploy step must override to "production".
          DJANGO_ENV: staging
          # Firebase Service Account JSON. Empty value → PushService runs
          # in stub mode (logs payload, returns success) — same no-op
          # pattern as Sentry. Set via GitHub Secrets to enable real FCM.
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 5m
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_RELEASE,DJANGO_ENV,FIREBASE_CREDENTIALS_JSON
          script: |
            cd /home/taximeter/beautygo/dev

            # Configure git auth via deploy token (HTTPS)
            git remote set-url origin https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/AndreyDeveloper84/beautygo_backend.git

            git fetch origin dev
            git reset --hard origin/dev

            # Refresh CI-managed env vars in .env without disturbing the rest.
            # Idempotent: drop any existing line for these keys, then append
            # the current value. Empty SENTRY_DSN is fine — base.py treats it
            # as "no Sentry" and skips init.
            touch .env
            sed -i \
              -e '/^SENTRY_DSN=/d' \
              -e '/^SENTRY_ENVIRONMENT=/d' \
              -e '/^SENTRY_RELEASE=/d' \
              -e '/^DJANGO_ENV=/d' \
              -e '/^FIREBASE_CREDENTIALS_PATH=/d' \
              .env
            {
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
              echo "SENTRY_RELEASE=$SENTRY_RELEASE"
              echo "DJANGO_ENV=$DJANGO_ENV"
              echo "FIREBASE_CREDENTIALS_PATH=/app/firebase-admin.json"
            } >> .env

            # Firebase Service Account JSON → bind-mounted file. Touch
            # first so the docker-compose mount succeeds even when the
            # secret is empty (PushService treats a zero-byte file as
            # "no creds" and falls into stub mode).
            touch firebase-admin.json
            chmod 600 firebase-admin.json
            if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
              printf '%s' "$FIREBASE_CREDENTIALS_JSON" > firebase-admin.json
            fi

            docker compose build
            # Bring up the full stack — redis + celery_worker + celery_beat
            # are new in PR3 and would otherwise sit unstarted; --force-recreate
            # on web makes sure new env (REDIS_URL, SENTRY_*) reaches it.
            docker compose up -d --force-recreate
            sleep 5
            # Wait for db to be healthy before migrating; needed because
            # django_celery_beat migrations land on this deploy.
            docker compose exec -T web python manage.py migrate --noinput || true
            docker compose ps
            echo "Deploy complete!"
