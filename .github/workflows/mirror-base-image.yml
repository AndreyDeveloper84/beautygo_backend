# -----------------------------------------------------------------------------
# mirror-base-image — DRF-1431
#
# ## The problem this exists to remove
#
# The dev deploy does NOT build on a GitHub runner. ci.yml's step
# "2/4 Build application images" is an appleboy/ssh-action that runs
# `docker compose build` ON THE PILOT VPS. So every deploy makes that box
# resolve `python:3.12-slim` from Docker Hub, and that box is in RU.
#
# On 2026-08-31 two consecutive dev deploys died there, before a single
# line of project code was compiled:
#
#   #4 ERROR: failed to authorize: failed to fetch anonymous token:
#        Get "https://auth.docker.io/token?scope=repository%3Alibrary..."
#   failed to run Build function: python:3.12-slim: failed to resolve
#        source metadata for docker.io/library/python:3.12-slim
#
# Lint and tests were green — the build never reached our code.
#
# ## Measured from the pilot, 2026-08-31 (not assumed)
#
#   ghcr.io/v2/                  401 in 0.26s / 0.31s / 0.26s   (3/3)
#   registry-1.docker.io/v2/     401 in 5.41s
#   auth.docker.io/token         200, but intermittent — it answered on
#                                the probe and had refused twice earlier
#                                the same day inside the deploy
#
# The host has no /etc/docker/daemon.json, no docker.service.d drop-in and
# no proxies in ~/.docker/config.json, so nothing on the box was mangling
# the request. Plain `docker pull python:3.12-slim` from the same shell
# succeeded first try. Conclusion: connectivity is fine, Hub's anonymous
# token endpoint is not dependable from this IP — the classic shape of
# anonymous-pull rate limiting.
#
# GHCR is already a hard dependency of this deploy (step 1/4 fetches the
# source from GitHub over the same egress), and it answers 20x faster than
# Hub. Serving the base layer from there removes a point of failure rather
# than adding one.
#
# ## What this workflow does
#
# Runs on a GitHub-hosted runner — which has good Hub connectivity — and
# copies the upstream manifest list into GHCR unchanged. Registry-to-
# registry, so the same digest comes out the other end; this is a copy,
# not a rebuild. Then it asserts the two digests match, so a silently
# corrupted or half-finished copy fails the job instead of shipping.
#
# The upstream ref is READ OUT OF THE DOCKERFILE rather than repeated
# here, so `ARG PYTHON_BASE_IMAGE=` stays the single source of truth. Bump
# the Dockerfile, re-run this workflow, done — there is no second place to
# forget.
#
# ## Operating it
#
# Weekly, plus on demand, plus automatically whenever the Dockerfile's
# base-image line changes on dev. Cheap (a manifest copy), idempotent, and
# it touches nothing on the pilot.
#
# One-time owner action before the first deploy relies on this: make the
# resulting package PUBLIC (GitHub -> your profile -> Packages ->
# beautygo-python -> Package settings -> Change visibility -> Public).
# It is a byte-identical copy of a public Docker Official Image, so this
# discloses nothing, and it means the pilot needs no registry credential
# on disk. If it is left private, ci.yml falls back to a `docker login`
# with GH_DEPLOY_TOKEN, which then needs the `read:packages` scope.
# -----------------------------------------------------------------------------
name: Mirror base image to GHCR

on:
  workflow_dispatch:
  schedule:
    # Mondays 03:17 UTC. Off-hours, and not on the hour — scheduled jobs
    # that ask for :00 queue behind everyone else's cron.
    - cron: '17 3 * * 1'
  push:
    branches: [dev]
    paths:
      # Only the base-image line matters, but paths filters work on files.
      # A Dockerfile edit is rare enough that re-mirroring on each one is
      # cheaper than the risk of the mirror going stale after a bump.
      - 'Dockerfile'
      - '.github/workflows/mirror-base-image.yml'

# Least privilege: read the tree, write one package. Nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-base-image
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream ref from the Dockerfile
        id: ref
        # Single source of truth. `ARG PYTHON_BASE_IMAGE=python:3.12-slim`
        # in the Dockerfile decides both what we mirror and what tag the
        # mirror carries, so the two can never drift apart.
        run: |
          set -euo pipefail
          upstream=$(grep -m1 -E '^ARG PYTHON_BASE_IMAGE=' Dockerfile | cut -d= -f2-)
          if [ -z "$upstream" ]; then
            echo "::error::Dockerfile has no 'ARG PYTHON_BASE_IMAGE=' line to mirror."
            exit 1
          fi
          case "$upstream" in
            *:*) tag="${upstream##*:}" ;;
            *)   echo "::error::upstream ref '$upstream' carries no tag"; exit 1 ;;
          esac
          # GHCR requires a lowercase owner segment.
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          mirror="ghcr.io/${owner}/beautygo-python:${tag}"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "mirror=$mirror"     >> "$GITHUB_OUTPUT"
          echo "mirroring $upstream  ->  $mirror"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Job-scoped token, expires with the run. `permissions.packages:
          # write` above is what makes it able to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the manifest list Hub -> GHCR
        # imagetools create is a registry-to-registry manifest copy: it
        # does not pull layers onto the runner and it preserves every
        # platform in the source manifest list, so the mirror is usable
        # from an arm64 laptop as well as the amd64 pilot.
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag '${{ steps.ref.outputs.mirror }}' \
            '${{ steps.ref.outputs.upstream }}'

      - name: Assert the mirror is digest-identical to upstream
        # Without this the job could report success over a partial copy.
        # Same digest = same bytes = the pilot builds on exactly the image
        # a laptop building against the Docker Hub default would get.
        run: |
          set -euo pipefail
          up=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' '${{ steps.ref.outputs.upstream }}')
          mi=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' '${{ steps.ref.outputs.mirror }}')
          echo "upstream ${{ steps.ref.outputs.upstream }}  $up"
          echo "mirror   ${{ steps.ref.outputs.mirror }}  $mi"
          if [ "$up" != "$mi" ]; then
            echo "::error::mirror digest does not match upstream — refusing to call this a mirror."
            exit 1
          fi
          echo "digests match — mirror is a faithful copy"
          {
            echo "### Base image mirrored"
            echo
            echo "| | ref | digest |"
            echo "|---|---|---|"
            echo "| upstream | \`${{ steps.ref.outputs.upstream }}\` | \`$up\` |"
            echo "| mirror | \`${{ steps.ref.outputs.mirror }}\` | \`$mi\` |"
          } >> "$GITHUB_STEP_SUMMARY"
