name: Smoke tests on dev VPS

# One-shot remote-runner: SSHes into the dev box and runs the Phase 3
# smoke suite against the deployed `web` container.
#
# Why we don't build (or install) anything here:
# - A check must not change what it checks. Anything this workflow writes
#   into the pilot makes the pilot's state a product of the smoke run,
#   and hides the very drift the run exists to catch.
#
# The private-dep auth gap this header used to describe is CLOSED. The
# Dockerfile takes `ARG GH_DEPLOY_TOKEN` and rewrites the github.com git
# URL with it; docker-compose.yml forwards it into `web.build.args`; and
# ci.yml's "2/4 Build application images" step runs `docker compose build`
# on the VPS with GH_DEPLOY_TOKEN present in that box's .env. The deployed
# image therefore already carries `ayla-ai-core` at the requirements.txt
# pin, and already carries git (Dockerfile installs it explicitly).
#
# STILL OUTSTANDING (DRF-1444 follow-up, deliberately not changed here):
# the `git reset --hard origin/dev` + `docker cp` sync block and the
# `migrate --noinput` / `seed_beverages` steps below are writes into the
# pilot too. They rest on the same "the image lags the host repo"
# assumption that no longer holds, but removing them changes what the
# suite covers, so it needs its own decision.

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest args (e.g. -k test_3_ for water-only)'
        required: false
        default: '-v --tb=short'
  schedule:
    # Daily at 04:00 UTC (07:00 MSK) — runs an hour after the
    # nutrition.purge_water_entries Celery beat (03:00 UTC), so any
    # purge regression surfaces in the same morning report.
    # Cron-only triggers respect the workflow definition on the default
    # branch (master), so this duplicates to master via the sync PR.
    - cron: '0 4 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Run smoke suite on dev VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 15m
          envs: PYTEST_ARGS,GITHUB_RUN_ID
          script: |
            set -o pipefail
            cd /home/taximeter/beautygo/dev

            echo "=== branch + commit on host (before sync) ==="
            git rev-parse --abbrev-ref HEAD
            git rev-parse --short HEAD
            echo

            echo "=== git pull origin/dev (host repo) ==="
            git fetch origin dev
            git reset --hard origin/dev
            git rev-parse --short HEAD
            echo

            echo "=== docker cp host → container (sync source under test) ==="
            # The Dockerfile-built image lags the host repo because rebuild
            # fails on private-dep auth (see workflow header). Push every
            # path the smoke suite touches into the running container:
            #
            # - nutrition/        — models, services, views, admin, migrations,
            #                        the smoke tests themselves
            # - djangoProject/    — settings/ (CELERY_BEAT_SCHEDULE additions
            #                        for DRF-302/306, MIDDLEWARE for DRF-242.4)
            # - ai/, tenants/     — peripheral models the smoke tests'
            #                        request-resolution path imports
            # - analytics/        — DRF-160 added to INSTALLED_APPS;
            #                        Django startup imports it before
            #                        any request runs. Without this the
            #                        whole web container ImportErrors.
            #
            # Strip __pycache__/.pyc on the host side first so we don't
            # ship stale bytecode into the container.
            find ./tenants ./users ./services ./reviews ./appointments \
                 ./nutrition ./ai ./djangoProject ./analytics \
                 ./notifications ./payments ./search \
              -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null || true
            # Trailing /. means "copy contents of src into dst" (overwrite
            # dst's contents). Without it, when dst exists as a dir docker
            # cp creates dst/<src-basename>/ instead — last run silently
            # produced /app/nutrition/nutrition/tests/smoke/ rather than
            # overwriting /app/nutrition/.
            #
            # Why all 12 app dirs (canonical sync block, mirrors
            # backfill-tenants-on-dev / verify-schema-on-dev): smoke
            # tests focus on nutrition surface, but Django startup
            # imports every app in INSTALLED_APPS. A stale notifications/
            # payments/search/users/services/reviews/appointments
            # in the lagging image can trip startup on cross-app signal
            # handlers / model relations. Aligning the three workflows
            # avoids drift.
            docker compose cp ./tenants/.       web:/app/tenants
            docker compose cp ./users/.         web:/app/users
            docker compose cp ./services/.      web:/app/services
            docker compose cp ./reviews/.       web:/app/reviews
            docker compose cp ./appointments/.  web:/app/appointments
            docker compose cp ./nutrition/.     web:/app/nutrition
            docker compose cp ./ai/.            web:/app/ai
            docker compose cp ./djangoProject/. web:/app/djangoProject
            # Apps not present in the lagging image — mkdir first so
            # docker cp doesn't no-op (cp -L wouldn't help).
            docker compose exec -T web mkdir -p /app/analytics /app/notifications /app/payments /app/search
            docker compose cp ./analytics/.     web:/app/analytics
            docker compose cp ./notifications/. web:/app/notifications
            docker compose cp ./payments/.      web:/app/payments
            docker compose cp ./search/.        web:/app/search
            echo

            echo "=== verify ayla-ai-core matches the requirements.txt pin ==="
            # DRF-1444. This step used to run, inside the live `web`
            # container:
            #     pip install --upgrade "ayla-ai-core @ git+...@v0.6.0"
            # That is a write into the pilot, not a check, and it was
            # actively harmful: requirements.txt has pinned v0.9.0
            # (f773e7d) since 2026-07-19, so every nightly run rolled the
            # library back 11 commits / 6 releases. Observed on the pilot
            # on 2026-09-03: `web` had 0.6.0 while celery_worker and
            # celery_beat — same image, never touched by this workflow —
            # had 0.9.0. The nightly was the sole cause of that split.
            #
            # The comment it hid behind ("image pre-dates DRF-241 Slice A",
            # "build-time git auth not plumbed yet") is stale; see the
            # workflow header. The `apt-get install git` that preceded it is
            # gone for the same reason — the Dockerfile installs git.
            #
            # What replaces it is the check that would have caught the
            # drift: compare the commit pip actually installed (PEP 610
            # direct_url.json) against the SHA pinned in the host checkout,
            # which the `git reset --hard origin/dev` above just refreshed.
            PINNED_REF="$(grep -m1 '^ayla-ai-core @ git+' requirements.txt | sed 's/.*[.]git@//; s/[[:space:]#].*//')"
            if [ -z "$PINNED_REF" ]; then
              echo "::error::could not read the ayla-ai-core pin from requirements.txt"
              exit 1
            fi
            echo "requirements.txt pins: $PINNED_REF"
            if ! docker compose exec -T web python -c "import json,sys,importlib.metadata as md; d=md.distribution('ayla-ai-core'); i=json.loads(d.read_text('direct_url.json') or '{}').get('vcs_info',{}); g=i.get('commit_id',''); r=i.get('requested_revision',''); print('container has: %s  commit=%s  requested=%s' % (d.version, g or '?', r or '?')); sys.exit(0 if '$PINNED_REF' in (g, r) else 1)"; then
              echo "::error::ayla-ai-core in the running web container does not match requirements.txt."
              echo "The pilot image is stale, or something mutated the container after deploy."
              echo "Fix by redeploying (ci.yml) -- do NOT pip install into the running container."
              exit 1
            fi
            echo

            echo "=== container view of smoke dir ==="
            docker compose exec -T web ls -la nutrition/tests/smoke/ | tail -10
            echo

            echo "=== run any pending migrations ==="
            docker compose exec -T web python manage.py migrate --noinput
            echo

            echo "=== migrations status ==="
            docker compose exec -T web python manage.py showmigrations nutrition | tail -12
            echo

            echo "=== ensure beverages seeded ==="
            docker compose exec -T web python manage.py seed_beverages
            echo

            echo "=== smoke suite ==="
            # Two-step resolution for PYTEST_ARGS: previously this was a
            # single ${PYTEST_ARGS:-"-v --tb=short"} on the docker-exec line.
            # Cron-triggered runs have empty PYTEST_ARGS (no inputs context),
            # and somewhere in the GH Actions → appleboy/ssh-action → remote
            # bash chain the literal `-v` was getting consumed as a flag,
            # producing `pytest: unrecognized arguments: - --tb=short` and
            # making smoke unrunnable on the cron schedule. Resolving into
            # a plain variable first sidesteps the chain.
            PYTEST_ARGS_RESOLVED="${PYTEST_ARGS:-}"
            if [ -z "$PYTEST_ARGS_RESOLVED" ]; then
              PYTEST_ARGS_RESOLVED="-v --tb=short"
            fi
            set +e
            docker compose exec -T web pytest nutrition/tests/smoke $PYTEST_ARGS_RESOLVED
            PYTEST_RC=$?
            set -e
            echo "pytest exit=$PYTEST_RC"

            # Telegram alert moved off the VPS — RKN egress filtering
            # blocks api.telegram.org from RU hosts (curl: 7 connection
            # timed out, ~2 minutes wasted per cron failure). The runner-
            # side `Notify on failure` step below uses GH-Actions secrets
            # and has clean egress. Keep the VPS .env diag log for visual
            # parity with previous runs (helps ops confirm token rotation).

            exit $PYTEST_RC
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Notify on failure (Telegram, runner-side)
        # Runs only when the SSH step above failed (i.e. smoke pytest
        # returned non-zero — the SSH action exits 1 on any non-zero
        # remote exit). Runner has clean egress to api.telegram.org;
        # secrets must be configured at repo level (TELEGRAM_BOT_TOKEN,
        # TELEGRAM_CHAT_ID). When either is empty the step skips
        # silently — no false alarms in the action log.
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "No TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret — skipping alert."
            echo "Configure both secrets at repo level to enable smoke-failure pings."
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # HTML mode + real newlines: previous attempt used `%0A` thinking
          # `--data-urlencode` would pass it through, but curl re-encodes
          # `%` → `%25`, so Telegram saw literal `%0A` text. Real `\n`
          # bytes get URL-encoded once, on the wire, to `%0A` — correct.
          # HTML parse_mode also makes <a href> robust against URL chars
          # that legacy Markdown chokes on.
          MSG=$'🔥 <b>Smoke tests on dev VPS — failed</b>\n'
          MSG+="Commit: <code>${SHA_SHORT}</code>"$'\n'
          MSG+="<a href=\"${RUN_URL}\">Open run</a>"
          curl -sS --max-time 10 -o /tmp/tg_resp.json -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" \
            || { echo "curl failed; alert dropped"; exit 0; }
          echo "telegram response: $(head -c 200 /tmp/tg_resp.json)"
          rm -f /tmp/tg_resp.json
