name: Smoke tests on dev VPS

# One-shot remote-runner: SSHes into the dev box and runs the Phase 3
# smoke suite against the deployed `web` container — the code that is
# actually running, not the head of `dev`.
#
# Why we don't build, install, sync or migrate anything here (DRF-2088):
# - A check must not change what it checks. Anything this workflow writes
#   into the pilot makes the pilot's state a product of the smoke run,
#   and hides the very drift the run exists to catch.
# - Until 18.09.2026 this job did `git reset --hard origin/dev` on the
#   host checkout, `docker compose cp` of five source dirs into the RUNNING
#   container, `migrate --noinput` and `seed_beverages`. Three consequences,
#   all measured in the run logs:
#     * 18.09 (run 35326587771): `tenants/` from dev was overlaid onto an
#       image that did not yet carry `users.internal_salon_admin_api`
#       (#503 merged two minutes earlier, deploy still running) →
#       ModuleNotFoundError on URL import → 69 of 84 tests red. Not a
#       deploy-window accident: any morning where dev is ahead of the
#       deployed image and a change touches both an overlaid and a
#       non-overlaid dir reproduces it. The overlay tested a tree that
#       existed nowhere.
#     * `migrate` applied migrations of UNDEPLOYED code to the pilot DB
#       every morning ("code behind schema") — the schema belongs to the
#       deploy, never to a check. Decision of the main window 18.09.
#     * `seed_beverages` wrote 59 rows a day. Preconditions are the
#       deploy's job; a missing seed is a finding, not something to paper
#       over here.
#   The subject under test is now the deployed SHA: the container's
#   SENTRY_RELEASE (written by ci.yml step 1/4 from `github.sha`) must
#   equal the host checkout HEAD (deploy leaves it there); the image
#   carries `nutrition/tests/smoke` itself (`COPY . .`, .dockerignore does
#   not exclude tests), so nothing is copied in. "dev moved ahead" is a
#   notice with both SHAs printed, not a failure.
# - 12–16.09 (five red runs): pytest died in `pytest_configure` on
#   `PermissionError: /app/test_results.log` (pytest.ini `log_file` inside
#   the image) before collecting a single test — fixed 16.09 by
#   `-o log_file=/tmp/test_results.log` below; 17.09 green confirmed it.
#
# Deploy gate (DRF-2088): this job shares the `deploy-dev-vps` concurrency
# group with ci.yml's `deploy` job. GitHub serialises the two — a smoke
# that starts while a deploy is in progress WAITS (pending, its own sign)
# and then runs against the freshly deployed contour, instead of racing
# `docker compose build` / container recreation. No API polling, no
# check-then-act window. A deploy that starts during a smoke waits for
# the smoke (minutes) — acceptable, and the deploy job already queues
# rather than cancels (`cancel-in-progress: false`).
#
# Cron-only triggers respect the workflow definition on the default
# branch — which is `dev` (`gh repo view`, 18.09.2026; master lags dev by
# hundreds of commits and takes no part), so a merge into dev reaches the
# schedule directly.

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest args (e.g. -k test_3_ for water-only)'
        required: false
        default: '-v --tb=short'
  schedule:
    # Daily at 04:00 UTC (07:00 MSK) — runs an hour after the
    # nutrition.purge_water_entries Celery beat (03:00 UTC), so any
    # purge regression surfaces in the same morning report. GitHub
    # delays scheduled runs under load — observed 08:50–09:40 UTC.
    - cron: '0 4 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: dev
    # Same group as ci.yml → deploy: never interleave with a deploy.
    concurrency:
      group: deploy-dev-vps
      cancel-in-progress: false
    steps:
      - name: Run smoke suite on dev VPS (deployed SHA, read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          command_timeout: 15m
          envs: PYTEST_ARGS,GITHUB_RUN_ID
          script: |
            set -o pipefail
            cd /home/taximeter/beautygo/dev
            echo "=== subject under test: the deployed SHA ==="
            # The deploy (ci.yml 1/4) leaves the host checkout at DEPLOY_SHA and
            # writes SENTRY_RELEASE=DEPLOY_SHA into .env, which the container
            # inherits. The two must agree; the host tree is NOT moved here.
            HOST_HEAD="$(git rev-parse HEAD)"
            DEPLOYED="$(docker compose exec -T web printenv SENTRY_RELEASE 2>/dev/null | tr -d '\r')"
            git fetch -q origin dev || true
            DEV_HEAD="$(git rev-parse origin/dev 2>/dev/null || echo unknown)"
            echo "host checkout: $HOST_HEAD"
            echo "container SENTRY_RELEASE: ${DEPLOYED:-<empty>}"
            echo "dev head: $DEV_HEAD"
            if ! printf '%s' "$DEPLOYED" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::the web container does not name its release (SENTRY_RELEASE='${DEPLOYED}') — cannot tell what is under test; redeploy (ci.yml), do not patch the container"
              exit 1
            fi
            if [ "$HOST_HEAD" != "$DEPLOYED" ]; then
              echo "::error::host checkout $HOST_HEAD ≠ deployed $DEPLOYED — someone moved the host tree after the deploy; the smoke tests only what is deployed. Redeploy or reset the host tree to the deployed SHA."
              exit 1
            fi
            if [ "$DEV_HEAD" != "$DEPLOYED" ]; then
              echo "::notice::dev head $DEV_HEAD is ahead of the deployed $DEPLOYED — testing what is deployed; the head gets its own smoke after its own deploy"
            fi
            echo
            echo "=== verify ayla-ai-core matches the requirements.txt pin (host tree = deployed SHA) ==="
            PINNED_REF="$(grep -m1 '^ayla-ai-core @ git+' requirements.txt | sed 's/.*[.]git@//; s/[[:space:]#].*//')"
            if [ -z "$PINNED_REF" ]; then
              echo "::error::could not read the ayla-ai-core pin from requirements.txt"
              exit 1
            fi
            echo "requirements.txt pins: $PINNED_REF"
            if ! docker compose exec -T web python -c "import json,sys,importlib.metadata as md; d=md.distribution('ayla-ai-core'); i=json.loads(d.read_text('direct_url.json') or '{}').get('vcs_info',{}); g=i.get('commit_id',''); r=i.get('requested_revision',''); print('container has: %s  commit=%s  requested=%s' % (d.version, g or '?', r or '?')); sys.exit(0 if '$PINNED_REF' in (g, r) else 1)"; then
              echo "::error::ayla-ai-core in the running web container does not match requirements.txt."
              echo "The pilot image is stale, or something mutated the container after deploy."
              echo "Fix by redeploying (ci.yml) -- do NOT pip install into the running container."
              exit 1
            fi
            echo
            echo "=== container view of smoke dir (from the image, nothing copied in) ==="
            docker compose exec -T web ls -la nutrition/tests/smoke/ | tail -10
            echo
            echo "=== migrations status (read-only; the deploy migrates, the smoke never does) ==="
            docker compose exec -T web python manage.py showmigrations nutrition | tail -12
            echo
            echo "=== storage backend pytest will inherit (env DJANGO_SETTINGS_MODULE wins over pytest.ini; DRF-1663) ==="
            docker compose exec -T web python manage.py shell -c "import os; from django.conf import settings; print('DJANGO_SETTINGS_MODULE=' + str(os.environ.get('DJANGO_SETTINGS_MODULE')), 'STORAGES.default.BACKEND=' + settings.STORAGES['default']['BACKEND'])"
            echo
            echo "=== smoke suite (deployed $DEPLOYED) ==="
            PYTEST_ARGS_RESOLVED="${PYTEST_ARGS:-}"
            if [ -z "$PYTEST_ARGS_RESOLVED" ]; then
              PYTEST_ARGS_RESOLVED="-v --tb=short"
            fi
            # `log_file` из pytest.ini указывает в /app образа, куда пользователь
            # контейнера писать не может — pytest падал INTERNALERROR до сбора
            # тестов: PermissionError на '/app/test_results.log' (12–16.09).
            set +e
            docker compose exec -T web pytest nutrition/tests/smoke \
              -o log_file=/tmp/test_results.log $PYTEST_ARGS_RESOLVED
            PYTEST_RC=$?
            set -e
            echo "pytest exit=$PYTEST_RC (deployed $DEPLOYED, dev head $DEV_HEAD)"

            # Telegram alert moved off the VPS — RKN egress filtering
            # blocks api.telegram.org from RU hosts (curl: 7 connection
            # timed out, ~2 minutes wasted per cron failure). The runner-
            # side `Notify on failure` step below uses GH-Actions secrets
            # and has clean egress. Keep the VPS .env diag log for visual
            # parity with previous runs (helps ops confirm token rotation).

            exit $PYTEST_RC
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Notify on failure (Telegram, runner-side)
        # Runs only when the SSH step above failed (i.e. smoke pytest
        # returned non-zero — the SSH action exits 1 on any non-zero
        # remote exit). Runner has clean egress to api.telegram.org;
        # secrets must be configured at repo level (TELEGRAM_BOT_TOKEN,
        # TELEGRAM_CHAT_ID). When either is empty the step skips
        # silently — no false alarms in the action log.
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "No TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret — skipping alert."
            echo "Configure both secrets at repo level to enable smoke-failure pings."
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # HTML mode + real newlines: previous attempt used `%0A` thinking
          # `--data-urlencode` would pass it through, but curl re-encodes
          # `%` → `%25`, so Telegram saw literal `%0A` text. Real `\n`
          # bytes get URL-encoded once, on the wire, to `%0A` — correct.
          # HTML parse_mode also makes <a href> robust against URL chars
          # that legacy Markdown chokes on.
          MSG=$'🔥 <b>Smoke tests on dev VPS — failed</b>\n'
          MSG+="Commit: <code>${SHA_SHORT}</code>"$'\n'
          MSG+="<a href=\"${RUN_URL}\">Open run</a>"
          curl -sS --max-time 10 -o /tmp/tg_resp.json -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" \
            || { echo "curl failed; alert dropped"; exit 0; }
          echo "telegram response: $(head -c 200 /tmp/tg_resp.json)"
          rm -f /tmp/tg_resp.json
