# Dependabot — обновления зависимостей бэкенда (DRF-1396).
#
# ─────────────────────────────────────────────────────────────────────
# target-branch: dev — и почему без него файл был бы обманом
# ─────────────────────────────────────────────────────────────────────
# Умолчальная ветка репозитория — `master`, её последний коммит от
# 09.05.2026, и она разошлась с `dev` (dev впереди на 672, позади на 41).
# Dependabot читает манифесты умолчальной ветки, а не рабочей, — и
# сегодняшние алерты описывают `master`, а не то, что выложено:
#
#   master  requirements.txt:  Django==5.2   sqlparse==0.5.3  DRF==3.16.0
#   dev     requirements.txt:  Django==5.2.5 sqlparse==0.6.0  DRF==3.16.1
#
# Отсюда, например, шесть открытых алертов на sqlparse при том, что на
# `dev` он уже 0.6.0 и все шесть закрыты. Считать по `master` —
# считать по ветке, которую никто не выкладывает.
#
# Цена решения, названная прямо: при заданном `target-branch` GitHub
# НЕ создаёт Dependabot security updates для этой экосистемы —
# security-PR'ы поднимаются только против умолчальной ветки. Алерты
# продолжают приходить; автоматический подъём идёт через
# version-обновления ниже.
#
# Настоящее лекарство — сделать `dev` умолчальной веткой репозитория.
# Это настройка репозитория, а не файла; решение за владельцем.
#
# ─────────────────────────────────────────────────────────────────────
# Частота и группировка — расчёт, а не вкус
# ─────────────────────────────────────────────────────────────────────
# Мерж в `dev` = выкладка на боевой пилот, поэтому поток PR'ов здесь
# опаснее, чем у бота: непрочитанный PR, промотанный «чтобы не мешал»,
# уезжает в прод. Потолок — три PR'а в первую неделю.
#
#   pip            еженедельно   ≤ 2 PR  (patch и minor раздельно)
#   github-actions ежемесячно    ≤ 1 PR
#   ─────────────────────────────────────
#   первая неделя  ≤ 3     дальше ≤ 2/нед
#
# Мажоры исключены: `ignore` ниже. Версия Django участвует в гейте
# окружения, её подъём — отдельное решение с отдельной проверкой.
#
# Docker намеренно НЕ подключён: базовый слой зеркалится в GHCR
# (`.github/workflows/mirror-base-image.yml`), автоподъём тега
# конфликтовал бы с зеркалом.
version: 2

updates:
  # ───────────────────────────────────────────────────────────────
  # Python — requirements.txt
  # ───────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Мажоры — руками, с обоснованием по каждому.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # ayla-ai-core закреплён по SHA и обязан совпадать с
      # pyproject.toml бота — иначе рендер промптов, диспетчер
      # инструментов и усечение истории разъедутся между каналами.
      # Подъём идёт согласованными PR'ами по процедуре, описанной
      # прямо в requirements.txt. Автомату здесь делать нечего.
      - dependency-name: "ayla-ai-core"

  # ───────────────────────────────────────────────────────────────
  # GitHub Actions — .github/workflows/*
  # ───────────────────────────────────────────────────────────────
  # Экшены ходят по подвижным тегам (@v1, @v4, @v5) — в том числе
  # `appleboy/ssh-action`, который в deploy держит ключ от пилота.
  # Один PR в месяц на все.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
